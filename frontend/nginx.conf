map $http_cf_connecting_ip $trusted_client_ip {
    default $http_cf_connecting_ip;
    "" $remote_addr;
}

# Never log request targets, query strings, referrers, credentials, Channel IDs,
# or request bodies at the reverse-proxy layer.
log_format safe_access 'time=$time_iso8601 method=$request_method status=$status '
                       'bytes=$body_bytes_sent duration=$request_time '
                       'request_id=$upstream_http_x_request_id';

server {
    listen 80;
    client_max_body_size 10m;
    access_log /var/log/nginx/access.log safe_access;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        # NotebookLM checks may legitimately approach the 90-second backend
        # timeout. Keep the proxy alive long enough to return that outcome.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # The V2 port is loopback-only. Cloudflare overwrites
        # CF-Connecting-IP before traffic reaches this trusted proxy.
        proxy_set_header X-Forwarded-For $trusted_client_ip;
        # This listener is loopback-only and reached through the required
        # HTTPS Cloudflare Tunnel, so never trust a client-supplied proto.
        proxy_set_header X-Forwarded-Proto https;
    }

    location /webhook/ {
        # Keep LINE payloads bounded at the edge as well as in the backend.
        client_max_body_size 1m;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $trusted_client_ip;
        proxy_set_header X-Forwarded-Proto https;
    }
}
